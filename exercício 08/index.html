<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 2: Redesign de Formulário</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .ux-form { max-width: 400px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-primary { background: #0066cc; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-primary:hover { background: #0052a3; }
    </style>
</head>
<body>
    <form class="ux-form">
        <h2>Cadastro de Usuário</h2>
        <div class="form-group">
            <label for="username">Nome Completo</label>
            <input type="text" id="username" placeholder="Ex: João Silva" required>
        </div>
        <div class="form-group">
            <label for="useremail">E-mail Corporativo</label>
            <input type="email" id="useremail" placeholder="nome@empresa.com" required>
        </div>
        <button type="submit" class="btn-primary">Concluir Cadastro</button>
    </form>
</body>
</html>
