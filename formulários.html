<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
     <style>
        *{box-sizing: border-box;
      margin: 0;
      padding: 0;}

      body{
        font-family: Arial, sans-serif;
      background-color: #fce4ec;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      }

      h1{
        color:#880e4f;
      text-align: center;
      margin-bottom: 10px;
      }
      .box{
        background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      }

      .box2{
        font-size: 1.2rem;
      color: #c2185b;
      margin-bottom: 15px;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 8px;
      }

      label{
        display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      font-weight: bold;
      color: #ad1457;
      font-size: 0.9rem;
      }

      input{
        width: 100%;
      padding: 10px;
      border: 1.5px solid #f48fb1;
      background-color: #fff8fa;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
      }

      input:focus{
        border-color: #e91e63;
      box-shadow: 0 0 5px rgba(233, 30, 99, 0.4);
      }

      .btn-submit{
        margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #e91e63; 
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
      }

      .btn-submit:hover {
      background-color: #c2185b;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    fieldset {
      border: 2px dashed #f48fb1; 
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #fff5f8;
    }

    legend {
      font-weight: bold;
      color: #d81b60;
      padding: 0 8px;
    }

    .search-box {
      display: flex;
      width: auto;
    }

    .search-box input {
        flex: 1;    
        border-radius: 6px 0 0 6px;

    }

    .btn-search {
      width: auto;
      padding: 10px 15px;
      background-color: #d81b60;
      color: white;
      border: none;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .btn-search:hover {
      background-color: #ad1457;
    }
    </style>
</head>
<body>
    <h1> Formulário</h1>
    <section class="box">
    <form action="#" method="POST">
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required placeholder="maria@email.com">

      <label for="senha">Senha:</label>
      <input 
        type="password" 
        id="senha" 
        name="senha" 
        required 
        pattern="(?=.*\d)(?=.*[a-zA-Z]).{8,}"
        title="A senha deve conter no mínimo 8 caracteres, com pelo menos uma letra e um número."
        placeholder="Mínimo 8 caracteres (letras e números)">

      <button type="submit" class="btn-submit">Cadastrar</button>
    </form>
  </section>

  <section class="box">
    <h2>Login Responsivo</h2>
    <form class="login-form" action="#" method="POST">
      <div>
        <label for="login-email">E-mail:</label>
        <input type="email" id="login-email" name="email" placeholder="seu@email.com" required>
      </div>
      <div>
        <label for="login-senha">Senha:</label>
        <input type="password" id="login-senha" name="senha" placeholder="Sua senha" required>
      </div>
      <button type="submit" class="btn-submit">Entrar</button>
    </form>
    </section>

    <section class="box">
        <form action="#" method="POST">
      <fieldset>
        <legend>Informações Pessoais</legend>
        <label for="nome-pessoal">Nome:</label>
        <input type="text" id="nome-pessoal" name="nome_pessoal">
        
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>
        <label for="rua">Rua:</label>
        <input type="text" id="rua" name="rua">
        
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade">
      </fieldset>

      <button type="submit" class="btn-submit">Salvar Dados</button>
    </form>
    </section>

    <section class="box">
       <form action="#" method="GET">
      <div class="search-box">
        <input type="search" name="q" placeholder="O que você procura?" required>
        <button type="submit" class="btn-search">Buscar Informações </button>
      </div>
    </form>
    </section>


</body>
</html>
